services:
  - type: web
    name: ilm-choqqisi
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: OWNER_PHONE
        sync: false
      - key: OWNER_PASSWORD
        sync: false
    disk:
      name: ilm-choqqisi-data
      mountPath: /var/data
      sizeGB: 1
